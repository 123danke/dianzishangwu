<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录注册 - Ecommerce</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .auth-page {
      min-height: calc(100vh - 60px - 80px);
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #ff5a5f 0%, #ff8a8f 100%);
    }
    .auth-card {
      background: #fff;
      width: 100%; max-width: 420px;
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 60px rgba(0,0,0,.15);
      overflow: hidden;
    }
    .auth-header {
      padding: 32px 32px 0;
      text-align: center;
    }
    .auth-header h1 {
      font-size: 26px; font-weight: 700; margin-bottom: 8px;
    }
    .auth-header p {
      font-size: 14px; color: var(--text-muted);
    }
    .auth-tabs {
      display: flex;
      margin: 24px 32px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .auth-tab {
      flex: 1; padding: 14px 0;
      text-align: center; font-weight: 500; cursor: pointer;
      color: var(--text-secondary); font-size: 15px;
      border-bottom: 2px solid transparent;
      transition: all .2s;
    }
    .auth-tab.active {
      color: var(--primary); border-bottom-color: var(--primary);
    }
    .auth-body { padding: 24px 32px 32px; }
    .auth-form { display: none; }
    .auth-form.active { display: block; }

    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
      font-size: 12px; color: var(--text-muted);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #f0f0f0;
    }

    .demo-account {
      background: #fff9e6; border: 1px dashed #ffd866;
      padding: 12px; border-radius: 8px; font-size: 12px; color: #8a6d00;
      line-height: 1.6;
    }
    .demo-account code {
      background: #fff; padding: 1px 6px; border-radius: 3px;
      font-family: monospace; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>欢迎来到 Ecommerce</h1>
        <p>登录或注册，开启购物之旅</p>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchTab('login')">登录</div>
        <div class="auth-tab" onclick="switchTab('register')">注册</div>
      </div>

      <div class="auth-body">
        <!-- 登录表单 -->
        <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>用户名 / 邮箱</label>
            <input type="text" id="loginAccount" placeholder="请输入用户名或邮箱" required />
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="loginPassword" placeholder="请输入密码" required minlength="6" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登 录</button>

          <div class="divider">演示账号</div>
          <div class="demo-account">
            👤 普通用户：<code>user01</code> / <code>123456</code><br/>
            👑 管理员：<code>admin</code> / <code>123456</code>
          </div>
        </form>

        <!-- 注册表单 -->
        <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="regUsername" placeholder="3-20位字符" required minlength="3" maxlength="20" />
          </div>
          <div class="form-group">
            <label>邮箱</label>
            <input type="email" id="regEmail" placeholder="your@email.com" required />
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="regPassword" placeholder="至少6位" required minlength="6" />
          </div>
          <div class="form-group">
            <label>确认密码</label>
            <input type="password" id="regConfirm" placeholder="再次输入密码" required minlength="6" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="regBtn">注 册</button>
        </form>

        <div class="auth-footer" id="authFooter">
          还没有账号？ <a href="javascript:switchTab('register')">立即注册</a>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/common.js"></script>
  <script>
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      if (tab === 'login') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
        document.getElementById('authFooter').innerHTML = '还没有账号？ <a href="javascript:switchTab(\'register\')">立即注册</a>';
      } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('registerForm').classList.add('active');
        document.getElementById('authFooter').innerHTML = '已有账号？ <a href="javascript:switchTab(\'login\')">立即登录</a>';
      }
    }

    // 支持 ?mode=register 自动切到注册 Tab
    const initMode = new URLSearchParams(location.search).get('mode');
    if (initMode === 'register') switchTab('register');

    // 已登录则跳回首页
    if (Auth.isLoggedIn()) {
      Toast.info('已登录，跳转中...');
      setTimeout(() => location.href = 'index.html', 800);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const account = document.getElementById('loginAccount').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = '登录中...';
      try {
        const data = await Api.post('/api/auth/login', { usernameOrEmail: account, password });
        Auth.setToken(data.token);
        Auth.setUser(data.user);
        const isAdmin = data.user?.role === 'Admin';
        Toast.success('登录成功！欢迎 ' + data.user.userName);
        const back = new URLSearchParams(location.search).get('redirect');
        setTimeout(() => {
          if (back) {
            location.href = back;
          } else if (isAdmin) {
            location.href = 'admin.html';
          } else {
            location.href = 'index.html';
          }
        }, 600);
      } catch (err) {
        // Api 内部已 Toast.error，这里可处理额外逻辑
      } finally {
        btn.disabled = false; btn.textContent = '登 录';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      if (password !== confirm) { Toast.error('两次密码不一致'); return; }
      const btn = document.getElementById('regBtn');
      btn.disabled = true; btn.textContent = '注册中...';
      try {
        const data = await Api.post('/api/auth/register', { username, email, password });
        Auth.setToken(data.token);
        Auth.setUser(data.user);
        Toast.success('注册成功，欢迎加入！');
        setTimeout(() => location.href = 'index.html', 600);
      } catch {
      } finally {
        btn.disabled = false; btn.textContent = '注 册';
      }
    }
  </script>
</body>
</html>
