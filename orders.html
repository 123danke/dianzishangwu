<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的订单 - Ecommerce</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .tabs {
      display: flex;
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .tab {
      flex: 1; padding: 14px; text-align: center;
      cursor: pointer; font-size: 14px; color: var(--text-secondary);
      border-bottom: 2px solid transparent;
    }
    .tab:hover { color: var(--primary); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    .tab .count {
      display: inline-block; margin-left: 4px;
      background: #ffecec; color: var(--primary);
      border-radius: 10px; font-size: 12px; padding: 1px 7px;
    }

    .order-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .order-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid #f5f5f5;
      font-size: 13px;
    }
    .order-head .order-no { color: var(--text-muted); }
    .order-head .status { font-weight: 600; }
    .status-pending { color: #e67e22; }
    .status-paid { color: #3498db; }
    .status-shipped { color: #9b59b6; }
    .status-completed { color: #27ae60; }
    .status-cancelled { color: var(--text-muted); }

    .order-items { padding: 14px 20px; }
    .order-item {
      display: grid; grid-template-columns: 60px 1fr auto; gap: 14px;
      align-items: center; padding: 8px 0;
    }
    .order-item .thumb {
      width: 60px; height: 60px;
      background: #f5f5f5; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: #ccc; overflow: hidden;
    }
    .order-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .order-item .name { font-size: 14px; margin-bottom: 4px; }
    .order-item .info { font-size: 12px; color: var(--text-muted); }
    .order-item .price { font-size: 14px; font-weight: 500; text-align: right; }

    .order-foot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px;
      border-top: 1px solid #f5f5f5;
      background: #fafafa;
    }
    .order-foot .total { font-size: 13px; color: var(--text-secondary); }
    .order-foot .total strong { color: var(--primary); font-size: 16px; }
    .order-foot .actions { display: flex; gap: 10px; }
    .order-foot button {
      padding: 6px 14px; border-radius: var(--radius-full);
      font-size: 12px; border: 1px solid var(--primary);
      background: #fff; color: var(--primary); cursor: pointer;
    }
    .order-foot button:hover { background: var(--primary); color: #fff; }
    .order-foot button.primary { background: var(--primary); color: #fff; }

    .pagination {
      display: flex; justify-content: center; gap: 8px; margin: 30px 0;
    }
    .pagination button {
      min-width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid #e0e0e0; background: #fff; cursor: pointer;
    }
    .pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pagination button:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="header"></div>

  <main class="container">
    <div class="tabs">
      <div class="tab active" data-status="" onclick="setFilter('')">全部订单</div>
      <div class="tab" data-status="0" onclick="setFilter(0)">待付款</div>
      <div class="tab" data-status="1" onclick="setFilter(1)">已付款</div>
      <div class="tab" data-status="2" onclick="setFilter(2)">已发货</div>
      <div class="tab" data-status="3" onclick="setFilter(3)">已完成</div>
      <div class="tab" data-status="4" onclick="setFilter(4)">已取消</div>
    </div>

    <div id="orderList">
      <div class="loading" style="text-align:center;padding:60px"><div class="spinner"></div></div>
    </div>
    <div class="pagination" id="pagination"></div>
  </main>

  <div id="footer"></div>

  <script src="js/common.js"></script>
  <script>
    if (!requireLogin()) { location.href = 'login.html?redirect=orders.html'; }

    let state = {
      status: null,
      pageNumber: 1,
      pageSize: 10,
      totalPages: 1
    };

    // 后端 OrderStatus 枚举字符串 -> 中文标签/CSS class/可用操作
    const STATUS_MAP = {
      PendingPayment: { label: '待付款', class: 'status-pending',   canPay: true,    canCancel: true },
      Paid:           { label: '待发货', class: 'status-paid',      canCancel: true },
      Shipped:        { label: '待收货', class: 'status-shipped' },
      Completed:      { label: '已完成', class: 'status-completed' },
      Cancelled:      { label: '已取消', class: 'status-cancelled' }
    };
    function getStatusInfo(s) {
      return STATUS_MAP[s] || { label: (s || '未知'), class: 'status-pending' };
    }

    function setFilter(s) {
      state.status = s === '' ? null : String(s);
      state.pageNumber = 1;
      document.querySelectorAll('.tab').forEach(t =>
        t.classList.toggle('active', t.dataset.status === String(s))
      );
      load();
    }

    async function load() {
      try {
        const q = new URLSearchParams({ pageNumber: state.pageNumber, pageSize: state.pageSize });
        if (state.status !== null) q.set('status', state.status);
        const data = await Api.get('/api/order?' + q.toString());
        state.totalPages = data.totalPages;
        render(data);
      } catch (e) {
        Toast.error('加载订单失败');
      }
    }

    function render(data) {
      const list = document.getElementById('orderList');
      if (!data.items || !data.items.length) {
        list.innerHTML = '<div class="empty" style="padding:60px"><div class="icon" style="font-size:80px">📦</div><h3>暂无订单</h3><p>快去选购心仪的商品吧</p><button class="btn primary" onclick="location.href=\'products.html\'">去逛逛</button></div>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      list.innerHTML = data.items.map(o => {
        const st = getStatusInfo(o.status);
        const actions = [];
        if (st.canPay)    actions.push(`<button onclick="pay('${o.orderNo}')">去付款</button>`, `<button onclick="cancelOrder('${o.orderNo}')">取消订单</button>`);
        if (st.canCancel && !st.canPay) actions.push(`<button onclick="cancelOrder('${o.orderNo}')">取消订单</button>`);
        return `
          <div class="order-card">
            <div class="order-head">
              <span class="order-no">订单号：${o.orderNo} · ${formatDate(o.createdAt)}</span>
              <span class="status ${st.class}">${st.label}</span>
            </div>
            <div class="order-items" style="padding:18px 20px;color:var(--text-muted)">
              共 ${o.itemCount} 件商品 · <a href="order-detail.html?orderNo=${o.orderNo}" style="color:var(--primary)">查看详情 ></a>
            </div>
            <div class="order-foot">
              <div class="total">实付 <strong>${formatMoney(o.totalAmount)}</strong></div>
              <div class="actions">
                <button onclick="location.href='order-detail.html?orderNo=${o.orderNo}'">查看详情</button>
                ${actions.join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');

      // 分页
      let pager = '';
      if (state.totalPages > 1) {
        pager += `<button ${state.pageNumber === 1 ? 'disabled' : ''} onclick="goto(${state.pageNumber - 1})">上一页</button>`;
        for (let i = Math.max(1, state.pageNumber - 2); i <= Math.min(state.totalPages, state.pageNumber + 2); i++)
          pager += `<button class="${i === state.pageNumber ? 'active' : ''}" onclick="goto(${i})">${i}</button>`;
        pager += `<button ${state.pageNumber === state.totalPages ? 'disabled' : ''} onclick="goto(${state.pageNumber + 1})">下一页</button>`;
      }
      document.getElementById('pagination').innerHTML = pager;
    }

    function goto(p) { state.pageNumber = p; load(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

    async function pay(orderNo) {
      if (!confirm('确认支付该订单？（演示环境模拟支付）')) return;
      try {
        await Api.post(`/api/order/${orderNo}/pay`);
        Toast.success('支付成功');
        load();
      } catch (e) { Toast.error(e.message || '支付失败'); }
    }

    async function cancelOrder(orderNo) {
      if (!confirm('确认取消订单？')) return;
      try {
        await Api.post(`/api/order/${orderNo}/cancel`);
        Toast.success('已取消');
        load();
      } catch (e) { Toast.error(e.message || '取消失败'); }
    }

    load();
  </script>
</body>
</html>
