<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品详情 - Ecommerce</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .detail {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: 32px;
      margin: 24px 0;
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }
    .gallery {
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #f5f5f7, #e8e8ed);
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
      font-size: 120px; color: #ccc;
      overflow: hidden;
    }
    .gallery img { width: 100%; height: 100%; object-fit: cover; }
    .info h1 { font-size: 24px; margin-bottom: 12px; }
    .info .subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
    .price-box {
      background: linear-gradient(135deg, #fff5f5, #fff);
      padding: 20px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      border: 1px solid #ffe0e0;
    }
    .price-box .price { font-size: 32px; color: var(--primary); font-weight: 700; }
    .price-box .price-old {
      font-size: 16px; color: var(--text-muted); text-decoration: line-through; margin-left: 12px;
    }
    .price-box .discount {
      display: inline-block;
      background: var(--primary); color: #fff;
      font-size: 12px; padding: 2px 8px; border-radius: 4px; margin-left: 8px;
    }
    .meta {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      margin-bottom: 24px;
    }
    .meta-item {
      font-size: 13px; color: var(--text-secondary);
    }
    .meta-item strong { color: var(--text-primary); font-weight: 500; }

    .qty-box { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .qty-box label { font-weight: 500; }
    .qty-control {
      display: flex; align-items: center;
      border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden;
    }
    .qty-control button {
      width: 36px; height: 36px; border: none; background: #f5f5f5; font-size: 18px;
      cursor: pointer;
    }
    .qty-control button:hover { background: #e8e8e8; }
    .qty-control input {
      width: 50px; text-align: center; border: none; border-left: 1px solid #e0e0e0;
      border-right: 1px solid #e0e0e0; height: 36px; font-size: 14px;
    }
    .actions { display: flex; gap: 16px; }
    .actions .btn { flex: 1; padding: 14px; font-size: 16px; border-radius: var(--radius-full); }
    .actions .btn-cart { background: var(--primary-light); color: var(--primary); }
    .actions .btn-cart:hover { background: #ffd4d6; }
    .actions .btn-buy { background: var(--primary); color: #fff; }
    .actions .btn-buy:hover { background: #e0484d; }

    .desc-card {
      background: var(--bg-white); border-radius: var(--radius-lg);
      padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow-sm);
    }
    .desc-card h3 {
      font-size: 18px; margin-bottom: 16px;
      padding-bottom: 12px; border-bottom: 1px solid #f0f0f0;
    }
    .desc-content { color: var(--text-secondary); line-height: 1.8; }

    @media (max-width: 768px) {
      .detail { grid-template-columns: 1fr; padding: 20px; gap: 24px; }
      .meta { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <main class="container">
    <div id="productDetail">
      <div class="loading" style="text-align:center;padding:80px"><div class="spinner"></div></div>
    </div>

    <div id="descCard" class="desc-card" style="display:none">
      <h3>商品详情</h3>
      <div class="desc-content" id="descContent"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/common.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    let product = null;
    let qty = 1;

    async function load() {
      try {
        product = await Api.get(`/api/product/${id}`);
        render();
      } catch (e) {
        if (e.code === 404) {
          document.getElementById('productDetail').innerHTML =
            '<div class="empty" style="padding:80px">商品不存在</div>';
        }
      }
    }

    function emoji() {
      const map = {
        '手机': '📱', '数码': '💻', '电脑': '💻', '服装': '👕', '鞋': '👟', '包': '👜',
        '食品': '🍎', '水果': '🍎', '零食': '🍪', '家居': '🏠', '电器': '🔌',
        '美妆': '💄', '图书': '📚', '玩具': '🎁', '运动': '⚽'
      };
      if (product.categoryName) {
        for (const [k, v] of Object.entries(map)) if (product.categoryName.includes(k)) return v;
      }
      return '🛍️';
    }

    function render() {
      const discount = product.originalPrice > product.price
        ? Math.round((1 - product.price / product.originalPrice) * 100)
        : 0;
      document.title = product.name + ' - Ecommerce';
      document.getElementById('productDetail').innerHTML = `
        <div class="detail">
          <div class="gallery">
            ${product.imageUrl
              ? `<img src="${product.imageUrl}" alt="${product.name}" onerror="this.parentElement.innerHTML='${emoji()}'">`
              : emoji()}
          </div>
          <div class="info">
            <h1>${product.name}</h1>
            <div class="subtitle">分类：${product.categoryName || '未分类'}</div>
            <div class="price-box">
              <span class="price">${formatMoney(product.price)}</span>
              ${product.originalPrice > product.price ? `<span class="price-old">${formatMoney(product.originalPrice)}</span><span class="discount">省 ${discount}%</span>` : ''}
            </div>
            <div class="meta">
              <div class="meta-item">已售 <strong>${product.salesCount}</strong> 件</div>
              <div class="meta-item">库存 <strong>${product.stock}</strong> 件</div>
              <div class="meta-item">浏览 <strong>${product.viewCount}</strong> 次</div>
              <div class="meta-item">上架时间 <strong>${formatDate(product.createdAt)}</strong></div>
            </div>
            <div class="qty-box">
              <label>数量</label>
              <div class="qty-control">
                <button onclick="changeQty(-1)">−</button>
                <input type="number" id="qtyInput" value="1" min="1" max="${product.stock}" onchange="qty=Math.max(1,Math.min(${product.stock},parseInt(this.value)||1))">
                <button onclick="changeQty(1)">+</button>
              </div>
              <span style="color:var(--text-muted);font-size:12px">库存 ${product.stock}</span>
            </div>
            <div class="actions">
              <button class="btn btn-cart" onclick="addToCart()">加入购物车</button>
              <button class="btn btn-buy" onclick="buyNow()">立即购买</button>
            </div>
          </div>
        </div>
      `;
      if (product.description) {
        document.getElementById('descContent').textContent = product.description;
        document.getElementById('descCard').style.display = 'block';
      }
    }

    function changeQty(d) {
      qty = Math.max(1, Math.min(product.stock, qty + d));
      document.getElementById('qtyInput').value = qty;
    }

    async function addToCart() {
      if (!requireLogin()) return;
      try {
        await Api.post('/api/cart', { productId: product.id, quantity: qty });
        Toast.success('已加入购物车');
        loadCartCount();
      } catch (e) {
        console.error('加入购物车失败:', e);
        Toast.error(e?.message || '加入购物车失败');
      }
    }

    async function buyNow() {
      if (!requireLogin()) return;
      try {
        await Api.post('/api/cart', { productId: product.id, quantity: qty });
        location.href = 'cart.html';
      } catch (e) {
        console.error('立即购买失败:', e);
        Toast.error(e?.message || '操作失败');
      }
    }

    load();
  </script>
</body>
</html>
