<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首页 - Ecommerce 电商商城</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    /* Hero Banner */
    .hero {
      background: linear-gradient(135deg, #ff5a5f 0%, #ff8a8f 50%, #ffb199 100%);
      color: #fff;
      padding: 80px 0;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(255,255,255,.2), transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(255,255,255,.15), transparent 50%);
    }
    .hero h1 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -1px;
      position: relative;
    }
    .hero p {
      font-size: 18px;
      opacity: .9;
      margin-bottom: 32px;
      position: relative;
    }
    .hero .btn-primary {
      background: #fff;
      color: var(--primary);
      font-size: 16px;
      padding: 14px 40px;
      position: relative;
    }
    .hero .btn-primary:hover { background: #f5f5f5; }

    /* 分区标题 */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 48px 0 20px;
    }
    .section-title h2 {
      font-size: 22px;
      font-weight: 700;
      position: relative;
      padding-left: 14px;
    }
    .section-title h2::before {
      content: '';
      position: absolute;
      left: 0; top: 4px; bottom: 4px;
      width: 4px;
      background: var(--primary);
      border-radius: 2px;
    }
    .section-title a { color: var(--text-secondary); font-size: 13px; }

    /* 商品网格 */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .product-card { cursor: pointer; }
    .product-card .img-wrap {
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #f5f5f7, #e8e8ed);
      display: flex; align-items: center; justify-content: center;
      font-size: 60px;
      color: #ccc;
      overflow: hidden;
    }
    .product-card .img-wrap img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .product-card .info { padding: 14px; }
    .product-card .name {
      font-size: 14px;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      height: 40px;
      margin-bottom: 8px;
    }
    .product-card .bottom {
      display: flex; justify-content: space-between; align-items: center;
    }
    .product-card .price { font-size: 18px; }
    .product-card .sales {
      font-size: 12px; color: var(--text-muted);
    }

    /* 分类导航 */
    .category-nav {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 12px 0;
      scrollbar-width: none;
    }
    .category-nav::-webkit-scrollbar { display: none; }
    .category-item {
      flex-shrink: 0;
      padding: 10px 20px;
      background: var(--bg-white);
      border-radius: var(--radius-full);
      font-weight: 500;
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
      transition: all .2s;
    }
    .category-item:hover, .category-item.active {
      background: var(--primary);
      color: #fff;
    }

    /* 特性栏 */
    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 40px;
    }
    .feature {
      background: var(--bg-white);
      padding: 24px;
      border-radius: var(--radius-lg);
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .feature .icon { font-size: 32px; margin-bottom: 8px; }
    .feature h4 { font-size: 14px; margin-bottom: 4px; }
    .feature p { font-size: 12px; color: var(--text-muted); }

    @media (max-width: 768px) {
      .product-grid { grid-template-columns: repeat(2, 1fr); }
      .features { grid-template-columns: repeat(2, 1fr); }
      .hero h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <!-- Hero Banner -->
  <section class="hero">
    <div class="container">
      <h1>🎉 夏季大促销</h1>
      <p>精选好物 · 全场低至 3 折 · 新用户立减 ¥50</p>
      <a href="category.html" class="btn btn-primary">立即选购 →</a>
    </div>
  </section>

  <main class="container">
    <!-- 分类导航 -->
    <div class="category-nav" id="categoryNav"></div>

    <!-- 推荐商品 -->
    <div class="section-title">
      <h2>🔥 为你推荐</h2>
      <a href="category.html">查看全部 →</a>
    </div>
    <div class="product-grid" id="recommendList">
      <div class="loading"><div class="spinner"></div></div>
    </div>

    <!-- 最新上架 -->
    <div class="section-title">
      <h2>✨ 最新上架</h2>
      <a href="category.html">查看全部 →</a>
    </div>
    <div class="product-grid" id="newList">
      <div class="loading"><div class="spinner"></div></div>
    </div>

    <!-- 特性栏 -->
    <div class="features">
      <div class="feature"><div class="icon">🚚</div><h4>全场包邮</h4><p>满 ¥99 免运费</p></div>
      <div class="feature"><div class="icon">🔒</div><h4>安全支付</h4><p>支持多种支付方式</p></div>
      <div class="feature"><div class="icon">↩️</div><h4>7 天无理由</h4><p>退换无忧</p></div>
      <div class="feature"><div class="icon">💬</div><h4>24h 客服</h4><p>贴心服务</p></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/common.js"></script>
  <script>
    // 渲染商品卡片
    function renderProductCard(p) {
      const emojiMap = {
        '手机': '📱', '数码': '💻', '电脑': '💻',
        '服装': '👕', '鞋': '👟', '包': '👜',
        '食品': '🍎', '水果': '🍎', '零食': '🍪',
        '家居': '🏠', '电器': '🔌', '美妆': '💄',
        '图书': '📚', '玩具': '🎁', '运动': '⚽'
      };
      let emoji = '🛍️';
      if (p.categoryName) {
        for (const [k, v] of Object.entries(emojiMap)) {
          if (p.categoryName.includes(k)) { emoji = v; break; }
        }
      }
      return `
        <div class="card product-card" onclick="location.href='product.html?id=${p.id}'">
          <div class="img-wrap">${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}" onerror="this.parentElement.innerHTML='${emoji}'">` : emoji}</div>
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="bottom">
              <span class="price">${formatMoney(p.price)}${p.originalPrice ? `<span class="price-old">${formatMoney(p.originalPrice)}</span>` : ''}</span>
              <span class="sales">已售 ${p.salesCount}</span>
            </div>
          </div>
        </div>
      `;
    }

    // 加载分类
    async function loadCategories() {
      try {
        const cats = await Api.get('/api/product/categories');
        const all = [];
        const flatten = list => list.forEach(c => { all.push(c); flatten(c.children || []); });
        flatten(cats);
        const nav = document.getElementById('categoryNav');
        nav.innerHTML = `<a href="category.html" class="category-item">全部</a>` +
          all.slice(0, 10).map(c =>
            `<a href="category.html?categoryId=${c.id}" class="category-item">${c.name}</a>`
          ).join('');
      } catch {}
    }

    // 加载推荐
    async function loadRecommended() {
      try {
        const list = await Api.get('/api/product/recommended?top=8');
        document.getElementById('recommendList').innerHTML =
          list.length ? list.map(renderProductCard).join('') :
          '<div class="empty" style="grid-column:span 4">暂无推荐商品</div>';
      } catch {}
    }

    // 加载最新
    async function loadNew() {
      try {
        const list = await Api.get('/api/product?pageSize=8&pageNumber=1');
        document.getElementById('newList').innerHTML =
          list.items.length ? list.items.map(renderProductCard).join('') :
          '<div class="empty" style="grid-column:span 4">暂无商品</div>';
      } catch {}
    }

    loadCategories();
    loadRecommended();
    loadNew();
  </script>
</body>
</html>
