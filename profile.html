<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人中心 - Ecommerce</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .profile {
      display: grid; grid-template-columns: 240px 1fr; gap: 20px;
      margin: 24px 0;
    }
    .sidebar {
      background: var(--bg-white); border-radius: var(--radius-lg);
      padding: 24px; box-shadow: var(--shadow-sm);
      height: fit-content;
    }
    .avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, #ff5a5f, #ff8a8f);
      color: #fff; font-size: 32px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
    }
    .username { text-align: center; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .email { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
    .role-badge {
      display: inline-block;
      padding: 2px 10px; border-radius: 10px; font-size: 12px;
      background: #e8f4ff; color: #1976d2;
    }
    .role-admin { background: #fff3e0; color: #e65100; }

    .menu { margin-top: 20px; border-top: 1px solid #f0f0f0; padding-top: 16px; }
    .menu-item {
      display: block; padding: 10px 14px;
      border-radius: 8px; cursor: pointer;
      font-size: 14px; color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .menu-item:hover { background: #f9f9f9; color: var(--text-primary); }
    .menu-item.active { background: var(--primary-light); color: var(--primary); font-weight: 500; }
    .menu-item .icon { margin-right: 8px; }

    .content {
      background: var(--bg-white); border-radius: var(--radius-lg);
      padding: 28px; box-shadow: var(--shadow-sm);
      min-height: 400px;
    }
    .content h2 {
      font-size: 20px; margin-bottom: 20px;
      padding-bottom: 12px; border-bottom: 1px solid #f0f0f0;
    }
    .form-row {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
    }
    @media (max-width: 768px) {
      .profile { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }

    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
      margin-bottom: 24px;
    }
    .stat {
      background: linear-gradient(135deg, #f8f9fa, #fff);
      padding: 20px; border-radius: var(--radius-md);
      text-align: center; border: 1px solid #f0f0f0;
    }
    .stat .num { font-size: 26px; font-weight: 700; color: var(--primary); }
    .stat .label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div id="header"></div>

  <main class="container">
    <div class="profile">
      <div class="sidebar">
        <div class="avatar" id="avatar">U</div>
        <div class="username" id="username">加载中...</div>
        <div class="email" id="email">-</div>
        <div style="text-align:center">
          <span class="role-badge" id="roleBadge">普通用户</span>
        </div>
        <div class="menu">
          <div class="menu-item active" onclick="switchView('profile', this)"><span class="icon">👤</span>个人资料</div>
          <div class="menu-item" onclick="switchView('password', this)"><span class="icon">🔐</span>修改密码</div>
          <div class="menu-item" onclick="location.href='orders.html'"><span class="icon">📦</span>我的订单</div>
          <div class="menu-item" onclick="location.href='cart.html'"><span class="icon">🛒</span>购物车</div>
          <div class="menu-item" onclick="doLogout()"><span class="icon">🚪</span>退出登录</div>
        </div>
      </div>

      <div class="content" id="content"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/common.js"></script>
  <script>
    if (!requireLogin()) { location.href = 'login.html?redirect=profile.html'; }

    let user = Auth.getUser();

    function switchView(view, el) {
      document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
      if (el) el.classList.add('active');
      if (view === 'profile') loadProfile();
      else if (view === 'password') loadPassword();
    }

    function renderSidebar() {
      document.getElementById('username').textContent = user.username;
      document.getElementById('email').textContent = user.email;
      document.getElementById('avatar').textContent = user.username.charAt(0).toUpperCase();
      const roleEl = document.getElementById('roleBadge');
      if (user.role === 1 || (user.role && user.role.includes && user.role.includes('Admin'))) {
        roleEl.textContent = '管理员';
        roleEl.classList.add('role-admin');
      } else {
        roleEl.textContent = '普通用户';
      }
      // 管理员入口
      if (user.role === 1 || (user.role && user.role.includes && user.role.includes('Admin'))) {
        const menu = document.querySelector('.menu');
        if (!menu.querySelector('.admin-entry')) {
          const div = document.createElement('div');
          div.className = 'menu-item admin-entry';
          div.style.color = '#e65100';
          div.innerHTML = '<span class="icon">⚙️</span>管理后台';
          div.onclick = () => location.href = 'admin.html';
          menu.insertBefore(div, menu.children[3]);
        }
      }
    }

    async function loadProfile() {
      document.getElementById('content').innerHTML =
        '<h2>个人资料</h2><div class="loading"><div class="spinner"></div></div>';
      try {
        user = await Api.get('/api/user/me');
        Auth.setUser(user);
        renderSidebar();
        document.getElementById('content').innerHTML = `
          <h2>个人资料</h2>
          <form onsubmit="saveProfile(event)">
            <div class="form-row">
              <div class="form-group">
                <label>用户名</label>
                <input type="text" id="pUsername" value="${user.username}" disabled />
              </div>
              <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="pEmail" value="${user.email}" required />
              </div>
              <div class="form-group">
                <label>昵称</label>
                <input type="text" id="pNickname" value="${user.nickname || ''}" />
              </div>
              <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="pPhone" value="${user.phone || ''}" placeholder="选填" />
              </div>
            </div>
            <div class="form-group">
              <label>个人简介</label>
              <textarea id="pBio" rows="3" placeholder="介绍一下自己">${user.bio || ''}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">保存修改</button>
          </form>
        `;
      } catch {}
    }

    async function saveProfile(e) {
      e.preventDefault();
      const data = {
        email: document.getElementById('pEmail').value.trim(),
        nickname: document.getElementById('pNickname').value.trim(),
        phone: document.getElementById('pPhone').value.trim(),
        bio: document.getElementById('pBio').value.trim()
      };
      try {
        const updated = await Api.put('/api/user/me', data);
        Auth.setUser(updated);
        user = updated;
        renderSidebar();
        Toast.success('保存成功');
      } catch {}
    }

    function loadPassword() {
      document.getElementById('content').innerHTML = `
        <h2>修改密码</h2>
        <form onsubmit="changePassword(event)" style="max-width:400px">
          <div class="form-group">
            <label>当前密码</label>
            <input type="password" id="oldPwd" required minlength="6" />
          </div>
          <div class="form-group">
            <label>新密码</label>
            <input type="password" id="newPwd" required minlength="6" />
          </div>
          <div class="form-group">
            <label>确认新密码</label>
            <input type="password" id="confirmPwd" required minlength="6" />
          </div>
          <button type="submit" class="btn btn-primary">修改密码</button>
        </form>
      `;
    }

    async function changePassword(e) {
      e.preventDefault();
      const oldPassword = document.getElementById('oldPwd').value;
      const newPassword = document.getElementById('newPwd').value;
      const confirmPassword = document.getElementById('confirmPwd').value;
      if (newPassword !== confirmPassword) { Toast.error('两次密码不一致'); return; }
      if (newPassword === oldPassword) { Toast.warning('新密码不能与旧密码相同'); return; }
      try {
        await Api.put('/api/user/password', { oldPassword, newPassword });
        Toast.success('密码修改成功，请重新登录');
        setTimeout(doLogout, 1200);
      } catch {}
    }

    function doLogout() {
      Auth.logout();
      Toast.success('已退出登录');
      setTimeout(() => location.href = 'login.html', 500);
    }

    renderSidebar();
    loadProfile();
  </script>
</body>
</html>
